# Context Guard — Default Configuration
# All values overridable via environment variables: CTX_GUARD_<KEY>
#
# HOW TOKEN BUDGETING WORKS:
# ┌─────────────────────────────────────────────────────────────────┐
# │  System + Memories + Skills  ~8-15k  (fixed, not controlled)   │
# │  History (bulks + topics)    controlled by TARGET_TOKENS        │
# │  Current work buffer         BUFFER_TOKENS headroom reserved    │
# │  ─────────────────────────────────────────────────────────────  │
# │  Effective trigger = TARGET_TOKENS + BUFFER_TOKENS              │
# │  e.g. 60k + 20k = compress when history > 80k                  │
# └─────────────────────────────────────────────────────────────────┘

# Enable/disable the plugin entirely
enabled: true
# env: CTX_GUARD_ENABLED=false

# Target: compress history DOWN to this many tokens
# Lower = cheaper per-call, but more LLM summarisation calls
target_tokens: 30000
# env: CTX_GUARD_TARGET_TOKENS=60000

# Buffer: headroom reserved for current agentic work
# (tool results, new responses queued up in current_topic)
buffer_tokens: 20000
# env: CTX_GUARD_BUFFER_TOKENS=20000

# Hard floor: never compress below this (protects recent context)
min_tokens: 8000
# env: CTX_GUARD_MIN_TOKENS=8000

# Emergency brake: compress immediately if history exceeds this
# (fires in message_loop_start, before prompt assembly)
hard_limit: 120000
# env: CTX_GUARD_HARD_LIMIT=120000

# Post-turn target: after agent fully responds, compact down to this
# This is the baseline for the NEXT user message
# Lower = cheaper next-turn input tokens
post_turn_target: 40000
# env: CTX_GUARD_POST_TURN_TARGET=40000

# Max chars per tool result (caps before entering history)
# Web search, code output etc. are typically 10-50k chars
# Capped here = never enters history bloated
max_result_chars: 4000
# env: CTX_GUARD_MAX_RESULT_CHARS=4000
